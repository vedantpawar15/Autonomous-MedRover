[build]
  base = "web_portal"
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"
  SECRETS_SCAN_OMIT_PATHS = "dist/**,dist/assets/**,dist/twin/**,public/twin/**"

[[redirects]]
  from = "/twin"
  to = "/twin/index.html"
  status = 200

[[redirects]]
  from = "/twin/*"
  to = "/twin/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
